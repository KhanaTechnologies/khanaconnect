<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Khana offer carousel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Khana "What we offer" carousel, 6 slides at 1080x1350 (4:5 feed).
     ?s=N shows one slide (for PNG screenshots); no ?s shows all slides as PDF pages. */
  :root {
    --bg: #edf1f8; --navy: #1b2559; --ink: #1f2430; --muted: #6b7280;
    --line: #e3e7ee; --border: #c9ced8; --dot: #c4c8d0; --wa: #3fae5a; --pale: #e8eefb;
  }
  @page { size: 1080px 1350px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { font-family: 'Inter', 'Segoe UI', sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .slide {
    width: 1080px; height: 1350px; overflow: hidden; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; padding-top: 70px;
    page-break-after: always; break-after: page;
  }
  .one .slide { display: none; }
  .one .slide.show { display: flex; }
  .mark { width: 92px; height: auto; }
  h1 { margin-top: 40px; font-weight: 800; font-size: 84px; line-height: 1.06; letter-spacing: -2px; color: var(--navy); text-align: center; }
  .sub { margin-top: 22px; font-size: 31px; line-height: 1.4; color: var(--muted); text-align: center; max-width: 860px; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 10px 0 20px; }
  .card {
    background: #fff; border: 2px solid var(--border); border-radius: 30px;
    box-shadow: 0 24px 48px rgba(27, 37, 89, 0.10); width: 860px; padding: 18px 40px; font-size: 31px;
  }
  .row { display: flex; align-items: center; gap: 24px; padding: 21px 0; }
  .row + .row { border-top: 2px solid var(--line); }
  .row svg { width: 38px; height: 38px; flex: none; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .row .txt { flex: 1; line-height: 1.3; }
  .row .note { display: block; font-size: 24px; color: var(--muted); margin-top: 4px; }
  .price { font-weight: 700; color: var(--navy); white-space: nowrap; text-align: right; }
  .price small { display: block; font-size: 22px; font-weight: 500; color: var(--muted); margin-top: 4px; }
  .plan .name { font-weight: 700; color: var(--navy); font-size: 34px; }
  .photo { width: 900px; height: 660px; border-radius: 30px; overflow: hidden; border: 2px solid var(--border); box-shadow: 0 24px 48px rgba(27, 37, 89, 0.10); background: #dfe5ef; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .small { font-size: 25px; color: var(--muted); text-align: center; margin-bottom: 26px; line-height: 1.4; }
  .dots { display: flex; gap: 22px; margin-bottom: 30px; }
  .dots span { width: 20px; height: 20px; border-radius: 50%; background: var(--dot); }
  .dots span.on { background: var(--navy); }
  .tag { font-size: 25px; color: var(--muted); margin-bottom: 56px; }
</style>
</head>
<body>
<div id="deck"></div>
<script>
const I = {
  globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  cart: '<svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 10.5h10.6L20.5 7H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  mail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>',
  chat: '<svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.4-4A8 8 0 1 1 20 11.5z"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1-3.5 4-5 7.5-5s6.5 1.5 7.5 5"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>',
  box: '<svg viewBox="0 0 24 24"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>',
  truck: '<svg viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3.5V16h-7"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17.5" cy="17.5" r="1.6"/></svg>',
  chart: '<svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"/></svg>',
  plug: '<svg viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5"/></svg>',
  ads: '<svg viewBox="0 0 24 24"><path d="M4 10v4h3l6 4V6L7 10zM16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  coin: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-.8-1.6-1.3-2.8-1.3-1.6 0-2.8.8-2.8 2s1.2 1.7 2.8 2.1 2.8.9 2.8 2.1-1.2 2-2.8 2c-1.3 0-2.4-.5-2.9-1.4M12 6.5v1.4M12 16.1v1.4"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
  handshake: '<svg viewBox="0 0 24 24"><path d="M3 12.5 6.5 9l3 1 3-2.5 3 1.5L21 12.5M6.5 9 3 12.5l5.5 5.5c.8.8 2 .8 2.8 0l5.7-5.7M9.5 15l1.5 1.5M12 13l2 2"/></svg>',
};
const row = (icon, text, note = '', price = '') =>
  `<div class="row">${I[icon]}<span class="txt">${text}${note ? `<span class="note">${note}</span>` : ''}</span>${price ? `<span class="price">${price}</span>` : ''}</div>`;
const plan = (name, what, monthly, setup) =>
  `<div class="row plan"><span class="txt"><span class="name">${name}</span><span class="note">${what}</span></span><span class="price">${monthly}<small>${setup}</small></span></div>`;

const SLIDES = [
  {
    h: 'What we offer.',
    sub: 'Websites, online stores and bookings for South African small businesses.',
    body: `<div class="photo"><img src="cover.png" alt=""></div>`,
  },
  {
    h: 'Every plan includes.',
    body: `<div class="card">
      ${row('globe', 'A website on your own domain')}
      ${row('cart', 'An online store or a booking system')}
      ${row('mail', 'Confirmations from your own mailbox')}
      ${row('chat', 'Order and booking details on your WhatsApp')}
      ${row('user', 'Your customer list stays yours')}
      ${row('shield', 'Hosting, updates and support from us')}
    </div>`,
  },
  {
    h: 'Plans.',
    body: `<div class="card">
      ${plan('Starter', 'Up to 5 pages · store or bookings', 'R450/month', 'R1,999 setup')}
      ${plan('Launch', 'Up to 10 pages · blog · store or bookings', 'R650/month', 'R3,499 setup')}
      ${plan('Growth', 'Cart recovery · promos · orders dashboard', 'R899/month', 'R6,999 setup')}
      ${plan('Scale', 'Store and bookings together', 'R1,799/month', 'R14,999 setup')}
    </div>`,
    foot: 'Setup can be split over 6 months. No VAT added.<br>Larger organisations and custom systems: quoted.',
  },
  {
    h: 'Add-ons.',
    body: `<div class="card">
      ${row('box', 'Large product catalogue', '500+ products', 'R199/month')}
      ${row('chart', 'Revenue Command Center', 'For Starter and Launch plans', 'R99/month')}
      ${row('mail', 'Advanced email campaigns', 'Higher-volume newsletters', 'R99/month')}
      ${row('truck', 'B2B trade ordering', 'Trade pricing and bulk orders', 'R299/month<small>+ setup</small>')}
      ${row('plug', 'Custom integration', 'Accounting, ERP or payment gateway', 'from R2,000<small>once-off</small>')}
      ${row('ads', 'Local Facebook & Instagram ads', 'Meta bills the ad spend to your card', 'Ask us')}
    </div>`,
  },
  {
    h: 'Founding<br>partners.',
    sub: 'Five spots for our first clients.',
    body: `<div class="card">
      ${row('star', 'No setup fee')}
      ${row('lock', 'Your monthly fee locked for 12 months')}
      ${row('handshake', 'In return: an honest review after 90 days', 'and permission to share your results')}
    </div>`,
  },
  {
    h: 'Let’s talk.',
    sub: 'Send us a WhatsApp and tell us about your business.',
    body: `<div class="card">
      ${row('chat', '+27 76 635 6790', 'WhatsApp or call')}
      ${row('globe', 'khanatechnologies.co.za')}
      ${row('mail', 'contact@khanatechnologies.co.za')}
    </div>`,
  },
];

const n = Number(new URLSearchParams(location.search).get('s') || 0);
if (n) document.body.classList.add('one');
document.getElementById('deck').innerHTML = SLIDES.map((s, i) => `
  <section class="slide ${i + 1 === n ? 'show' : ''}">
    <img class="mark" src="mark.png" alt="">
    <h1>${s.h}</h1>
    ${s.sub ? `<p class="sub">${s.sub}</p>` : ''}
    <div class="stage">${s.body}</div>
    ${s.foot ? `<p class="small">${s.foot}</p>` : ''}
    <div class="dots">${SLIDES.map((_, j) => `<span class="${j === i ? 'on' : ''}"></span>`).join('')}</div>
    <div class="tag">We build it, launch it, and stay.</div>
  </section>`).join('');
</script>
</body>
</html>
