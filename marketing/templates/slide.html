<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Khana slide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  /* Khana carousel style: pale blue-grey page, crescent mark, big navy headline,
     one white app card, five progress dots, gray tagline. 1080x1080. */
  :root {
    --bg: #edf1f8;
    --navy: #1b2559;
    --ink: #1f2430;
    --muted: #6b7280;
    --line: #e3e7ee;
    --border: #c9ced8;
    --dot: #c4c8d0;
    --wa: #3fae5a;
    --pale-blue: #e8eefb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: var(--bg); overflow: hidden; }
  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding-top: 70px;
  }
  .mark { width: 96px; height: auto; }
  h1 {
    margin-top: 44px;
    font-weight: 800; font-size: 86px; line-height: 1.08; letter-spacing: -2px;
    color: var(--navy); text-align: center;
  }
  .stage { flex: 1; display: flex; align-items: center; padding-bottom: 20px; justify-content: center; width: 100%; }
  .card {
    background: #fff; border: 2px solid var(--border); border-radius: 30px;
    box-shadow: 0 24px 48px rgba(27, 37, 89, 0.10);
    width: 480px; padding: 26px 32px; font-size: 30px;
  }
  .card .title { font-size: 25px; font-weight: 500; color: var(--ink); padding-bottom: 16px; border-bottom: 2px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .row { display: flex; align-items: center; gap: 18px; padding: 14px 0; }
  .rows .row + .row { border-top: 2px solid var(--line); }
  .row svg { width: 34px; height: 34px; flex: none; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .hl { background: var(--pale-blue); border-radius: 12px; margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
  .small { font-size: 24px; color: var(--muted); }
  .bubble { background: var(--wa); color: #fff; border-radius: 22px 22px 6px 22px; padding: 16px 22px; font-size: 27px; line-height: 1.3; margin-top: 14px; }
  .bubble.in { background: #eef0f4; color: var(--ink); border-radius: 22px 22px 22px 6px; }
  .bubble.khana { background: var(--pale-blue); color: var(--ink); }
  .pill { font-size: 22px; border: 2px solid var(--ink); border-radius: 10px; padding: 4px 12px; font-weight: 500; }
  .dots { display: flex; gap: 22px; margin-bottom: 34px; }
  .dots span { width: 20px; height: 20px; border-radius: 50%; background: var(--dot); }
  .dots span.on { background: var(--navy); }
  .tag { font-size: 25px; color: var(--muted); margin-bottom: 62px; }
</style>
</head>
<body>
  <img class="mark" src="mark.png" alt="">
  <h1 id="headline"></h1>
  <div class="stage"><div class="card" id="card"></div></div>
  <div class="dots" id="dots"></div>
  <div class="tag">We build it, launch it, and stay.</div>

<script>
const I = {
  globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  cake: '<svg viewBox="0 0 24 24"><path d="M4 20h16M5 20v-7h14v7M5 16c2 1 3 1 4.7 0s3 1 4.6 0 3-1 4.7 0M12 13V9M12 6.5c.8-.8.8-1.7 0-2.5-.8.8-.8 1.7 0 2.5z"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  mail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1-3.5 4-5 7.5-5s6.5 1.5 7.5 5"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};
const row = (icon, text, cls = '') => `<div class="row ${cls}">${I[icon]}<span>${text}</span></div>`;

const SLIDES = {
  1: {
    h: 'Your own site.',
    card: `<div class="title"><span>yourbusiness.co.za</span><span class="pill">Order</span></div>
      <div class="rows">${row('cake', 'Celebration cake')}${row('cal', 'Collect Saturday')}${row('clock', '10:00')}</div>`,
  },
  2: {
    h: 'Your own mailbox.',
    card: `<div class="title" style="display:block;line-height:1.5">
        <div><span class="small">From:</span> hello@yourbusiness.co.za</div>
        <div><span class="small">Subject:</span> Order confirmed</div></div>
      <div style="padding-top:18px;line-height:1.5">1 × Celebration cake<br>Collect Saturday · 10:00</div>`,
  },
  3: {
    h: 'Your WhatsApp.',
    card: `<div class="title"><span>Your Business</span></div>
      <div class="bubble">Hi Thabo, your cake is confirmed. Collect Saturday at 10:00.</div>
      <div class="bubble">Reply here if anything changes.</div>`,
  },
  4: {
    h: 'Your customer list.',
    card: `<div class="title"><span>Customers</span></div>
      <div class="rows">
        ${row('user', 'Thabo M. · <span class="small">3 orders</span>', 'hl')}
        ${row('user', 'Naledi K. · <span class="small">1 booking</span>')}
        ${row('user', 'Anika V. · <span class="small">5 orders</span>')}
        ${row('user', 'Sipho D. · <span class="small">1 order</span>')}
      </div>`,
  },
  5: {
    h: 'And a team<br>that stays.',
    card: `<div class="title"><span>Khana Technologies</span></div>
      <div class="bubble in">Can we add the new Christmas range?</div>
      <div class="bubble khana">Yes. Send the photos, we'll load them.</div>`,
  },
};

const n = Number(new URLSearchParams(location.search).get('s') || 1);
const s = SLIDES[n];
document.getElementById('headline').innerHTML = s.h;
document.getElementById('card').innerHTML = s.card;
document.getElementById('dots').innerHTML = [1, 2, 3, 4, 5].map((i) => `<span class="${i === n ? 'on' : ''}"></span>`).join('');
</script>
</body>
</html>
